[versions]
agp = "8.8.2"
kotlin = "2.1.20"
aboutlibraries = "11.6.3"

# AndroidX
core-ktx = "1.15.0"
activity-ktx = "1.10.1"
appcompat = "1.7.0"
fragment-ktx = "1.8.6"
navigation = "2.8.9"
webkit = "1.13.0"
biometric = "1.1.0"
work-runtime = "2.10.0"

# UI / Material
material = "1.12.0"
circularprogressbar = "3.1.0"
dragdrop-swipe-recyclerview = "1.2.0"
aboutpage = "2.0.0"

# Network & Utilities
jsoup = "1.18.3"
gson = "2.11.0"
hasher = "1.2"
process-phoenix = "2.1.2"
easypermissions = "3.0.0"
adfilter = "v0.9.1"

# Testing
junit = "4.13.2"
robolectric = "4.14.1"
mockito = "5.17.0"
mockito-kotlin = "5.4.0"
json = "20250107"
espresso = "3.6.1"
test-runner = "1.6.2"
test-rules = "1.6.1"
test-orchestrator = "1.5.1"
test-ext-junit = "1.2.1"
testng = "6.9.6"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "work-runtime" }

# Material & UI
material = { module = "com.google.android.material:material", version.ref = "material" }
circularprogressbar = { module = "com.mikhaellopez:circularprogressbar", version.ref = "circularprogressbar" }
dragdrop-swipe-recyclerview = { module = "com.ernestoyaquello.dragdropswiperecyclerview:drag-drop-swipe-recyclerview", version.ref = "dragdrop-swipe-recyclerview" }
about-page = { module = "io.github.medyo:android-about-page", version.ref = "aboutpage" }
aboutlibraries = { module = "com.mikepenz:aboutlibraries", version.ref = "aboutlibraries" }
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }

# Utilities
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
hasher = { module = "com.github.ihimanshurawat:Hasher", version.ref = "hasher" }
process-phoenix = { module = "com.jakewharton:process-phoenix", version.ref = "process-phoenix" }
easypermissions = { module = "pub.devrel:easypermissions", version.ref = "easypermissions" }
ad-filter = { module = "com.github.Edsuns.AdblockAndroid:ad-filter", version.ref = "adfilter" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
json = { module = "org.json:json", version.ref = "json" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
androidx-test-espresso-web = { module = "androidx.test.espresso:espresso-web", version.ref = "espresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "test-orchestrator" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
testng = { module = "org.testng:testng", version.ref = "testng" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }
