plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.aboutlibraries)
    alias(libs.plugins.kotlin.compose)
}


android {
    namespace 'com.cylonid.nativealpha'
    compileSdk 37

    dependenciesInfo {
        includeInApk = false
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    flavorDimensions "default"
    productFlavors {
        extended {
            dimension "default"
            applicationIdSuffix ".pro"
            resValue "string", "app_name", "Native Alpha +"
        }
        extendedGithub {
            dimension "default"
            resValue "string", "app_name", "Native Alpha"
        }
        standard {
            dimension "default"
            isDefault true
            resValue "string", "app_name", "Native Alpha"
        }
    }

    defaultConfig {
        applicationId "com.cylonid.nativealpha"
        minSdkVersion 28
        targetSdkVersion 35
        versionCode 1520
        versionName "1.6.3" // x-release-please-version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
    }

    buildFeatures {
        compose true
        buildConfig true
        dataBinding true
        viewBinding true
        resValues true
    }

    composeCompiler {
        includeComposeMappingFile = false
    }


    signingConfigs {
        release {
            def keystoreFile = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty("KEYSTORE_FILE") ? project.property("KEYSTORE_FILE") : null)
            if (keystoreFile && file(keystoreFile).exists()) {
                storeFile file(keystoreFile)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty("KEYSTORE_PASSWORD") ? project.property("KEYSTORE_PASSWORD") : "")
                keyAlias System.getenv("KEY_ALIAS") ?: (project.hasProperty("KEY_ALIAS") ? project.property("KEY_ALIAS") : "")
                keyPassword System.getenv("KEY_PASSWORD") ?: (project.hasProperty("KEY_PASSWORD") ? project.property("KEY_PASSWORD") : "")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
            resValue "string", "app_name", "_DEBUG-Native Alpha"
        }
    }

    base {
        archivesName = 'NativeAlpha'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui
    implementation libs.androidx.webkit
    implementation libs.androidx.biometric
    implementation libs.androidx.work.runtime

    // Jetpack Compose & Material 3
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.androidx.lifecycle.runtime.compose
    debugImplementation libs.androidx.compose.ui.tooling

    implementation libs.material
    implementation libs.aboutlibraries.compose
    implementation libs.aboutlibraries.core

    implementation libs.jsoup
    implementation libs.gson
    implementation libs.hasher
    implementation libs.process.phoenix
    implementation libs.easypermissions
    implementation libs.timber
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.github.Edsuns.AdblockAndroid:adblock-client') using project(':adblock-client')
        }
    }

    implementation project(':adblock-client')
    implementation(libs.ad.filter) {
        exclude group: 'org.jetbrains.anko'
    }

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.json
    testImplementation libs.mockito.core
    testImplementation libs.mockito.android
    testImplementation libs.mockito.kotlin
    testImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.test.manifest

    androidTestImplementation libs.mockito.android
    androidTestImplementation libs.androidx.test.espresso.contrib
    androidTestImplementation libs.androidx.test.espresso.web
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.runner
    androidTestUtil libs.androidx.test.orchestrator
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.testng
}
